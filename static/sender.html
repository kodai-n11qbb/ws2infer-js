<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cam2WebRTC Sender</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
</head>

<body>
    <div class="container">
        <h1>Cam2WebRTC Sender</h1>

        <div class="controls">
            <input type="text" id="roomIdInput" class="room-id-input" placeholder="ルームIDを入力" value="default-room">
            <br>
            <button id="startCamera" class="btn-primary">カメラ開始</button>
            <button id="createRoom" class="btn-secondary" disabled>ルーム作成</button>
            <button id="startStreaming" class="btn-success" disabled>配信開始</button>
        </div>

        <div id="status" class="status info">準備完了</div>

        <div class="video-container">
            <h3>ローカルビデオ:</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>

        <div class="video-container">
            <h3>ルーム情報:</h3>
            <div id="roomInfo">
                <p>ルームID: <span id="roomId">-</span></p>
                <p>配信方式: <span id="roomMode">P2P Mesh (1対多)</span></p>
                <p>接続数: <span id="connectionCount">0</span></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { Cam2WebRTCSender } from './js/sender.js';
        document.addEventListener('DOMContentLoaded', () => {
            new Cam2WebRTCSender();
        });
    </script>
</body>

</html>
