[package]
name = "wasm-inference"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "ImageData"] }
# Lightweight image crate for processing byte buffers
image = { version = "0.24", default-features = false, features = ["png"] }
