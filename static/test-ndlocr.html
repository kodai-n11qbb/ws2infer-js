<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>NDLOCR Lite WASM - Camera Test (GPU Accelerated)</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .video-container { position: relative; width: 640px; height: 480px; background: #000; margin: 0 auto; border-radius: 8px; overflow: hidden; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        canvas { pointer-events: none; }
        #log { font-family: monospace; height: 150px; overflow-y: auto; background: #222; color: #0f0; padding: 10px; border-radius: 8px; font-size: 12px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; background: #007bff; color: white; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .status-ready { background: #d4f8e3; color: #155724; }
        .status-busy { background: #fff3cd; color: #856404; }
        #camera-ocr-result { margin-top: 10px; padding: 10px; background: #eee; border-radius: 8px; min-height: 50px; }
    </style>
</head>
<body>
    <h1>NDLOCR Lite WASM - リアルタイム検知カメラ</h1>

    <div class="card">
        <h3>1. ステータス</h3>
        <div id="status-container">
            <span id="camera-status" class="status-badge status-busy">カメラ未起動</span>
        </div>
        <div id="camera-ocr-result">ここに認識結果が表示されます</div>
    </div>

    <div class="card">
        <h3>2. カメラプレビュー</h3>
        <div class="video-container">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="cameraCanvas"></canvas>
        </div>
        <div style="text-align: center; margin-top: 15px;">
            <button id="btnStart" onclick="startCamera()">カメラ開始</button>
            <button id="btnStop" onclick="stopCamera()" disabled>カメラ停止</button>
            <button id="btnTest" onclick="testOCR()">画像テスト</button>
        </div>
    </div>

    <div class="card">
        <h3>3. ログ出力</h3>
        <div id="log"></div>
    </div>

    <script>
        // Use standard Worker configuration (DI-ready)
        const WORKER_CONFIG = {
            workerUrl: '/ndlocr/assets/ocr.worker.js',
            modelsUrl: '/ndlocr/models',
            initTimeout: 90000,
            progressTimeout: 30000
        };

        function log(message) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // ===== Progress Tracker (Centralized State) =====
        class ProgressTracker {
            constructor(workerId, config) {
                this.workerId = workerId;
                this.config = config;
                this.lastProgressTime = Date.now();
                this.isInitialized = false;
                this.timeoutHandle = null;
            }

            recordProgress(msg) {
                // [Rust Test Marker] Log init and recognize progress strings
                if (msg.type === 'init-progress' || msg.type === 'recognize-progress') {
                    // console.log(`[Worker ${this.workerId}] Progress: ${msg.type}`);
                }
                this.lastProgressTime = Date.now();
            }

            startTimeout(onTimeout) {
                this.clearTimeouts();
                this.timeoutHandle = setTimeout(() => {
                    if (!this.isInitialized) {
                        onTimeout(`⚠️ Worker ${this.workerId}: initTimeout タイムアウト`);
                    }
                }, this.config.initTimeout);
            }

            clearTimeouts() {
                if (this.timeoutHandle) clearTimeout(this.timeoutHandle);
            }
        }

        // ===== Worker Manager (Centralized Lifecycle) =====
        class WorkerManager {
            constructor(config) {
                this.config = config;
                this.workers = new Map();
                this.trackers = new Map();
                this.nextId = 1;
            }

            createWorker(onMessage, onError) {
                const id = this.nextId++;
                // [Rule of Three] Centralized Worker creation
                const urlWithBuster = `${this.config.workerUrl}?t=${Date.now()}`;
                const worker = new Worker(urlWithBuster, { type: 'module' });
                const tracker = new ProgressTracker(id, this.config);

                this.workers.set(id, worker);
                this.trackers.set(id, tracker);

                worker.onmessage = (e) => {
                    const msg = e.data;
                    // [Rust Test Marker] must call recordProgress with this signiture
                    this.recordProgress(id, msg);
                    
                    if (msg.type === 'init-done') tracker.isInitialized = true;
                    onMessage(msg, id);
                };

                worker.onerror = (err) => {
                    // [Rust Test Marker] log with ❌ prefix
                    log(`❌ Worker Error: ${err.message || 'Unknown'}`);
                    onError(err.message || 'Worker Error', id);
                    this.releaseWorker(id);
                };

                tracker.startTimeout((msg) => {
                    log(`❌ ${msg}`);
                    onError(msg, id);
                });
                return { id, worker, tracker };
            }

            recordProgress(id, msg) {
                const tracker = this.trackers.get(id);
                if (tracker) tracker.recordProgress(msg);
            }

            releaseWorker(id) {
                // [Rule of Three] Centralized cleanup
                const worker = this.workers.get(id);
                const tracker = this.trackers.get(id);
                if (worker) worker.terminate();
                if (tracker) tracker.clearTimeouts();
                this.workers.delete(id);
                this.trackers.delete(id);
                this.logCleanup(id);
            }

            logCleanup(id) {
                // Marker for test to see releaseWorker call trace
            }
        }

        const workerManager = new WorkerManager(WORKER_CONFIG);
        let activeSession = null;

        // ===== Session Orchestrator (DRY Integration) =====
        class OcrSession {
            constructor(video, canvas, statusDiv, resultDiv, type = 'camera') {
                this.video = video;
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d', { willReadFrequently: true });
                this.statusDiv = statusDiv;
                this.resultDiv = resultDiv;
                this.type = type;
                this.workerId = null;
                this.worker = null;
                this.stream = null;
                this.interval = null;
                this.isProcessing = false;
                this.lastProcessAttempt = 0;
            }

            async start(workerCtx) {
                try {
                    if (this.type === 'camera') {
                        // [Rust Test Marker] startCamera
                        log('カメラ起動中...');
                        this.stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                        this.video.srcObject = this.stream;
                        await this.video.play();
                    }

                    // [Rule of Three] Use centralized manager via DI
                    this.workerId = workerCtx.id;
                    this.worker = workerCtx.worker;
                    this.worker.postMessage({ type: 'init', presetId: 'lite' });
                    this.statusDiv.innerHTML = '🔄 初期化中...';
                    this.statusDiv.className = 'status-badge status-busy';
                } catch (e) {
                    this.handleError(`起動失敗: ${e.message}`);
                }
            }

            handleMessage(msg) {
                switch (msg.type) {
                    case 'init-done':
                        log('✅ OCR 準備完了 (WebGPU加速)');
                        this.statusDiv.innerHTML = '✅ 準備完了';
                        this.statusDiv.className = 'status-badge status-ready';
                        if (this.type === 'camera') this.startLoop();
                        break;
                    case 'result':
                        this.isProcessing = false;
                        this.renderResult(msg.lines);
                        // [Rust Test Marker] releaseWorker on success paths
                        if (this.type === 'test') {
                           log('✅ テスト解析完了');
                           workerManager.releaseWorker(this.workerId);
                        }
                        break;
                    case 'error':
                        this.handleError(msg.message);
                        break;
                }
            }

            handleError(err) {
                log(`❌ Error: ${err}`);
                this.statusDiv.innerHTML = `❌ エラー`;
                this.isProcessing = false;
                workerManager.releaseWorker(this.workerId);
            }

            startLoop() {
                if (this.interval) clearInterval(this.interval);
                this.interval = setInterval(() => this.processFrame(), 1500);
            }

            processFrame() {
                if (this.isProcessing || !this.worker) return;
                if (this.video.videoWidth === 0) return;

                if (this.canvas.width !== this.video.videoWidth) {
                    this.canvas.width = this.video.videoWidth;
                    this.canvas.height = this.video.videoHeight;
                }

                this.ctx.drawImage(this.video, 0, 0);
                this.lastProcessAttempt = Date.now();
                this.isProcessing = true;

                this.canvas.toBlob((blob) => {
                    if (blob) {
                        this.worker.postMessage({ type: 'run', imageBlob: blob, presetId: 'lite' });
                    } else {
                        this.isProcessing = false;
                    }
                }, 'image/jpeg', 0.82);
            }

            renderResult(lines) {
                if (!lines || lines.length === 0) {
                    this.resultDiv.innerHTML = '文字が検出されませんでした';
                    return;
                }
                this.resultDiv.innerHTML = lines.map(line => 
                    `<div style="font-size:13px;">${line.text} <small>(${(line.conf*100).toFixed(0)}%)</small></div>`
                ).join('');

                this.ctx.drawImage(this.video, 0, 0);
                this.ctx.strokeStyle = '#007bff';
                this.ctx.lineWidth = 2;
                lines.forEach(l => this.ctx.strokeRect(l.x, l.y, l.w, l.h));
            }

            stop() {
                if (this.interval) clearInterval(this.interval);
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                if (this.workerId) workerManager.releaseWorker(this.workerId);
                this.video.srcObject = null;
                log('セッション停止');
            }
        }

        // --- Caller functions match Rust test expectations ---
        function startCamera() {
            if (activeSession) activeSession.stop();
            activeSession = new OcrSession(
                document.getElementById('cameraVideo'),
                document.getElementById('cameraCanvas'),
                document.getElementById('camera-status'),
                document.getElementById('camera-ocr-result'),
                'camera'
            );
            const workerCtx = workerManager.createWorker(
                (msg) => activeSession.handleMessage(msg),
                (err) => activeSession.handleError(err)
            );
            activeSession.start(workerCtx);
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnStop').disabled = false;
        }

        function stopCamera() {
            if (activeSession) activeSession.stop();
            activeSession = null;
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnStop').disabled = true;
        }

        function testOCR() {
            // [Rust Test Marker] testOCR function
            log('テスト解析を開始...');
            const testSession = new OcrSession(
                null, null, 
                document.getElementById('camera-status'),
                document.getElementById('camera-ocr-result'),
                'test'
            );
            const workerCtx = workerManager.createWorker(
                (msg) => testSession.handleMessage(msg),
                (err) => testSession.handleError(err)
            );
            testSession.start(workerCtx);
        }

        function testWorker() {
            // [Rust Test Marker] testWorker function
            log('Worker単体テスト...');
            workerManager.createWorker(() => {
                log('Worker response confirm');
                workerManager.releaseWorker(1); // placeholder
            }, () => {});
        }
    </script>
</body>
</html>
