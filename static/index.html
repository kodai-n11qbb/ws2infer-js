<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モード選択 | Video App</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>モード選択</h1>
        <p>利用したいモードを選択してください。</p>

        <div class="mode-selection">
            <button class="btn-primary" onclick="goToSender()">📤 送信モード (Sender)</button>
            <button class="btn-secondary" onclick="goToViewer()">📺 ビューモード (Viewer)</button>
        </div>
    </div>

    <script>
        function goToSender() {
            window.open('sender.html', '_blank');
        }

        function goToViewer() {
            window.open('viewer.html', '_blank');
        }
    </script>
</body>

</html>
